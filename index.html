<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>WANDER - 城市灵感</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171715;
      --muted: #74736d;
      --paper: #f7f5ef;
      --surface: #ffffff;
      --line: rgba(23, 23, 21, 0.1);
      --coral: #ff5b4d;
      --green: #155f48;
      --shadow: 0 24px 70px rgba(28, 27, 22, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #deded9;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.6), transparent 45%),
        #deded9;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .app-shell {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--paper);
      position: relative;
    }

    .status-bar {
      height: calc(22px + env(safe-area-inset-top));
      padding: max(8px, env(safe-area-inset-top)) 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }

    .signal span {
      width: 2px;
      border-radius: 1px;
      background: currentColor;
    }

    .signal span:nth-child(1) { height: 4px; }
    .signal span:nth-child(2) { height: 6px; }
    .signal span:nth-child(3) { height: 8px; }
    .signal span:nth-child(4) { height: 10px; }

    .battery {
      width: 19px;
      height: 9px;
      padding: 1px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      width: 13px;
      height: 5px;
      display: block;
      border-radius: 1px;
      background: currentColor;
    }

    .battery::after {
      content: "";
      width: 2px;
      height: 4px;
      border-radius: 0 1px 1px 0;
      background: currentColor;
      position: absolute;
      right: -4px;
      top: 2px;
    }

    header {
      padding: 18px 20px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 31px;
      font-weight: 500;
      line-height: 1;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.62);
      cursor: pointer;
      position: relative;
      transition: transform 180ms ease, background 180ms ease;
    }

    .icon-button:active {
      transform: scale(0.94);
    }

    .notification-dot {
      width: 8px;
      height: 8px;
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--coral);
      position: absolute;
      top: 7px;
      right: 7px;
    }

    .categories {
      padding: 10px 20px 17px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      min-height: 34px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: transparent;
      white-space: nowrap;
      cursor: pointer;
      font-size: 13px;
      transition: color 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .category.active {
      color: #fff;
      border-color: var(--green);
      background: var(--green);
    }

    main {
      padding: 0 16px 110px;
    }

    .hero-card {
      min-height: 480px;
      overflow: hidden;
      border-radius: 6px;
      color: #fff;
      position: relative;
      isolation: isolate;
      box-shadow: var(--shadow);
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      z-index: -2;
      transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .hero-card:active .hero-image {
      transform: scale(1.025);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(to bottom, rgba(10, 10, 8, 0.04) 28%, rgba(10, 10, 8, 0.82) 100%);
    }

    .card-top {
      padding: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .place-tag {
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 4px;
      background: rgba(15, 15, 13, 0.18);
      backdrop-filter: blur(12px);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .save-button {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(15, 15, 13, 0.2);
      backdrop-filter: blur(12px);
    }

    .save-button.saved {
      color: var(--ink);
      border-color: #fff;
      background: #fff;
    }

    .card-content {
      padding: 20px;
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
    }

    .card-kicker {
      margin: 0 0 10px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card-title {
      max-width: 310px;
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 34px;
      font-weight: 500;
      line-height: 1.13;
    }

    .meta-row {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .author {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .avatar {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      background: var(--coral);
      font-family: Georgia, serif;
      font-size: 13px;
      font-style: italic;
    }

    .author-name {
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .engagement {
      display: flex;
      gap: 7px;
    }

    .metric {
      min-width: 58px;
      height: 34px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 17px;
      background: rgba(15, 15, 13, 0.2);
      backdrop-filter: blur(10px);
      cursor: pointer;
      font-size: 11px;
    }

    .metric.liked {
      color: #fff;
      border-color: var(--coral);
      background: var(--coral);
    }

    .section-heading {
      margin: 29px 2px 14px;
      display: flex;
      align-items: end;
      justify-content: space-between;
    }

    .section-heading h2 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 22px;
      font-weight: 500;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 11px;
    }

    .stories {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .story {
      min-width: 0;
    }

    .story-image-wrap {
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 5px;
      background: #d8d7d2;
    }

    .story img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .story:hover img {
      transform: scale(1.035);
    }

    .story h3 {
      margin: 10px 0 5px;
      font-size: 14px;
      line-height: 1.35;
    }

    .story p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .bottom-nav {
      width: min(100%, 430px);
      height: calc(76px + env(safe-area-inset-bottom));
      padding: 9px 22px env(safe-area-inset-bottom);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(247, 245, 239, 0.92);
      backdrop-filter: blur(20px);
      position: fixed;
      bottom: 0;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #8b8982;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 10px;
    }

    .nav-item.active {
      color: var(--ink);
    }

    .nav-item svg,
    .icon-button svg,
    .metric svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.8;
    }

    .nav-item::after {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: transparent;
    }

    .nav-item.active::after {
      background: var(--coral);
    }

    .toast {
      min-width: 150px;
      padding: 11px 16px;
      color: #fff;
      border-radius: 4px;
      background: rgba(23, 23, 21, 0.92);
      position: fixed;
      bottom: 94px;
      left: 50%;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transform: translate(-50%, 12px);
      transition: opacity 180ms ease, transform 180ms ease;
      font-size: 12px;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 560px) {
      body {
        padding: 28px 0;
      }

      .app-shell {
        min-height: calc(100vh - 56px);
        border: 1px solid rgba(23, 23, 21, 0.08);
        border-radius: 24px;
        box-shadow: 0 30px 90px rgba(24, 23, 20, 0.2);
      }

      .bottom-nav {
        width: 430px;
      }

      .toast {
        bottom: 42px;
      }
    }

    @media (max-width: 360px) {
      .card-title {
        font-size: 29px;
      }

      .hero-card {
        min-height: 440px;
      }

      .metric {
        min-width: 50px;
        padding: 0 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <div class="status-icons">
        <span class="signal"><span></span><span></span><span></span><span></span></span>
        <i data-lucide="wifi" style="width: 13px;"></i>
        <span class="battery"></span>
      </div>
    </div>

    <header>
      <div>
        <p class="eyebrow">Thursday, 22 October</p>
        <h1>WANDER</h1>
      </div>
      <button class="icon-button" type="button" aria-label="查看通知" title="通知" id="notificationButton">
        <i data-lucide="bell"></i>
        <span class="notification-dot"></span>
      </button>
    </header>

    <nav class="categories" aria-label="内容分类">
      <button class="category active" type="button">为你推荐</button>
      <button class="category" type="button">咖啡</button>
      <button class="category" type="button">建筑</button>
      <button class="category" type="button">周末</button>
      <button class="category" type="button">展览</button>
    </nav>

    <main>
      <article class="hero-card">
        <img
          class="hero-image"
          src="https://copilot-cn.bytedance.net/api/ide/v1/text_to_image?prompt=Editorial%20travel%20photography%20of%20a%20quiet%20modern%20concrete%20bookstore%20courtyard%20in%20Shanghai%2C%20lush%20green%20tree%2C%20warm%20late%20afternoon%20sunlight%2C%20one%20small%20human%20figure%20walking%2C%20high-end%20architecture%20magazine%20style%2C%20realistic%2C%20natural%20colors%2C%20vertical%20composition%2C%20no%20text%2C%20no%20logo&image_size=portrait_4_3"
          alt="阳光下的现代建筑庭院"
        >
        <div class="card-top">
          <span class="place-tag">Shanghai · 4.8 km</span>
          <button class="icon-button save-button" type="button" aria-label="收藏地点" title="收藏" id="saveButton">
            <i data-lucide="bookmark"></i>
          </button>
        </div>
        <div class="card-content">
          <p class="card-kicker">城市漫游 · No. 028</p>
          <h2 class="card-title">在树影和清水混凝土之间，读完一个下午</h2>
          <div class="meta-row">
            <div class="author">
              <span class="avatar">Y</span>
              <span class="author-name">Yuan 的城市笔记</span>
            </div>
            <div class="engagement">
              <button class="metric" type="button" aria-label="点赞" id="likeButton">
                <i data-lucide="heart"></i>
                <span id="likeCount">328</span>
              </button>
              <button class="metric" type="button" aria-label="查看评论" id="commentButton">
                <i data-lucide="message-circle"></i>
                <span>24</span>
              </button>
            </div>
          </div>
        </div>
      </article>

      <div class="section-heading">
        <h2>附近灵感</h2>
        <span>今日更新 12 条</span>
      </div>

      <section class="stories" aria-label="附近灵感">
        <article class="story">
          <div class="story-image-wrap">
            <img
              src="https://copilot-cn.bytedance.net/api/ide/v1/text_to_image?prompt=Realistic%20editorial%20food%20photography%20of%20a%20minimal%20Japanese-inspired%20coffee%20bar%20in%20Shanghai%2C%20green%20ceramic%20cup%2C%20dark%20wood%20counter%2C%20soft%20window%20light%2C%20quiet%20atmosphere%2C%20premium%20lifestyle%20magazine%20style%2C%20vertical%20composition%2C%20no%20text%2C%20no%20logo&image_size=portrait_4_3"
              alt="安静的木质咖啡吧台"
              loading="lazy"
            >
          </div>
          <h3>一杯手冲的安静时刻</h3>
          <p>永康路 · 1.2 km</p>
        </article>
        <article class="story">
          <div class="story-image-wrap">
            <img
              src="https://copilot-cn.bytedance.net/api/ide/v1/text_to_image?prompt=Realistic%20editorial%20photography%20of%20a%20small%20contemporary%20art%20gallery%20in%20Shanghai%2C%20white%20walls%2C%20bold%20red%20sculpture%2C%20two%20visitors%2C%20natural%20skylight%2C%20premium%20culture%20magazine%20style%2C%20vertical%20composition%2C%20no%20text%2C%20no%20logo&image_size=portrait_4_3"
              alt="白色展厅里的红色雕塑"
              loading="lazy"
            >
          </div>
          <h3>红色之后：青年艺术展</h3>
          <p>西岸 · 6.5 km</p>
        </article>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" type="button" data-label="发现">
        <i data-lucide="compass"></i>
        <span>发现</span>
      </button>
      <button class="nav-item" type="button" data-label="地图">
        <i data-lucide="map"></i>
        <span>地图</span>
      </button>
      <button class="nav-item" type="button" data-label="收藏">
        <i data-lucide="bookmark"></i>
        <span>收藏</span>
      </button>
      <button class="nav-item" type="button" data-label="我的">
        <i data-lucide="user-round"></i>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <div class="toast" role="status" aria-live="polite" id="toast"></div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    const toast = document.querySelector("#toast");
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("visible");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 1600);
    }

    document.querySelectorAll(".category").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".category").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        showToast(`已切换到${button.textContent}`);
      });
    });

    const saveButton = document.querySelector("#saveButton");
    saveButton.addEventListener("click", () => {
      const isSaved = saveButton.classList.toggle("saved");
      saveButton.setAttribute("aria-label", isSaved ? "取消收藏地点" : "收藏地点");
      saveButton.innerHTML = `<i data-lucide="${isSaved ? "bookmark-check" : "bookmark"}"></i>`;
      lucide.createIcons();
      showToast(isSaved ? "已加入收藏" : "已取消收藏");
    });

    const likeButton = document.querySelector("#likeButton");
    const likeCount = document.querySelector("#likeCount");
    likeButton.addEventListener("click", () => {
      const isLiked = likeButton.classList.toggle("liked");
      likeCount.textContent = isLiked ? "329" : "328";
      showToast(isLiked ? "谢谢你的喜欢" : "已取消点赞");
    });

    document.querySelector("#notificationButton").addEventListener("click", () => {
      document.querySelector(".notification-dot")?.remove();
      showToast("暂时没有新通知");
    });

    document.querySelector("#commentButton").addEventListener("click", () => {
      showToast("24 条旅行者评论");
    });

    document.querySelectorAll(".nav-item").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        showToast(button.dataset.label);
      });
    });
  </script>
</body>
</html>
